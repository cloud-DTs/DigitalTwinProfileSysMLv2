services:
  postgresdbserver:
    image: postgres:9.6.6
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=sysml2
    ports:
      - "5432:5432"
    volumes:
      - postgresdbserver:/var/lib/postgresql/data

  sysmlapiserver:
    image: "sysml.api:latest"
    tty: true
    environment:
      - HOME=/home
    depends_on:
      - postgresdbserver
    ports:
      - "9000:9000"
    restart: always

  sysml-kernel:
    image: "sysml.jupyter:latest"
    tty: true
    stdin_open: true
    container_name: sysml-kernel-container
    environment:
      - SYSML_API_SERVER=http://sysmlapiserver:9000
    ports:
      - "8888:8888"
    entrypoint: [] 
    command: >
      conda run --no-capture-output -n sysml 
      jupyter kernel --kernel=sysml --ip=0.0.0.0
    depends_on:
      - sysmlapiserver

volumes:
  postgresdbserver: