services:
  postgresdbserver:
    image: postgres:9.6.6
    restart: always
    env_file: ".env"
    ports:
      - "5432:5432"
    volumes:
      - postgresdbserver:/var/lib/postgresql/data

  sysmlapiserver:
    image: csba184/sysml.api:latest
    tty: true
    env_file: ".env"
    depends_on:
      - postgresdbserver
    ports:
      - "9000:9000"
    restart: always

  sysml-kernel:
    image: csba184/sysml.jupyter:latest
    tty: true
    stdin_open: true
    container_name: sysml-kernel-container
    environment:
      - SYSML_API_SERVER=http://sysmlapiserver:9000
    ports:
      - "8888:8888"
    entrypoint: []
    command: >
      conda run --no-capture-output -n sysml 
      jupyter kernel --kernel=sysml --ip=0.0.0.0
    depends_on:
      - sysmlapiserver

volumes:
  postgresdbserver: