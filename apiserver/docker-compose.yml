services:
  sysml-kernel:
    image: csba184/sysml.jupyter:latest
    tty: true
    stdin_open: true
    container_name: sysml-kernel-container
    environment:
      - SYSML_API_SERVER=http://sysmlapiserver:9000
    ports:
      - "8888:8888"
    entrypoint: []
    command: >
      conda run --no-capture-output -n sysml 
      jupyter kernel --kernel=sysml --ip=0.0.0.0